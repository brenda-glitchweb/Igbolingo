
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Mascot | Igbolingo</title>

    <link rel="stylesheet" href="profile-setup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="profile-container">

        <section class="profile-card">

            <a href="index.html" class="logo">
                <span>✦</span> Igbolingo
            </a>

            <div class="profile-heading">
                <span class="eyebrow">MAKE YOURSELF AT HOME</span>

                <h1>Choose Your Mascot</h1>

                <p>
                    Every learner needs a companion.
                    Choose the character that will accompany
                    you on your Igbo learning journey.
                </p>
            </div>

            <div class="mascot-grid">

                <button class="mascot-option" type="button" data-mascot="cat">
                    <img src="cat.png" alt="Cat mascot">
                    <span>Cat</span>
                </button>

                <button class="mascot-option" type="button" data-mascot="lion">
                    <img src="lion.png" alt="Lion mascot">
                    <span>Lion</span>
                </button>

                <button class="mascot-option" type="button" data-mascot="parrot">
                    <img src="parrot.png" alt="Parrot mascot">
                    <span>Parrot</span>
                </button>

                <button class="mascot-option" type="button" data-mascot="panda">
                    <img src="panda.png" alt="Panda mascot">
                    <span>Panda</span>
                </button>

                <button class="mascot-option" type="button" data-mascot="rabbit">
                    <img src="rabbit.png" alt="Rabbit mascot">
                    <span>Rabbit</span>
                </button>

                <button class="mascot-option" type="button" data-mascot="elephant">
                    <img src="elephant.png" alt="Elephant mascot">
                    <span>Elephant</span>
                </button>

            </div>

            <p class="selection-message">
                Select one mascot to continue.
            </p>

            <button class="continue-button" type="button" disabled>
                Continue
            </button>

        </section>

    </main>
<script type="module" src="profile-setup.js"></script>
</body>
</html>
